<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa-Sweeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    
        /* Custom Styles for Inter Font and Game Board */
        body {
            font-family: 'Inter', sans-serif;
            background-color: Salmon;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #game-board {
            display: grid;
            border: 5px solid #368BC1;
            background-color: #add8e6 ;
        }

        .cell {
            width: 30px;
            height: 30px;
            background-color: brown;
            border: 1px solid;
            border-color: #fff #7b7b7b #7b7b7b #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s;
        }

        .cell:active:not(.revealed):not(.flag) {
            border-color: #7b7b7b #fff #fff #7b7b7b;
            background-color: #ccc;
        }
       
        .revealed {
            background-color: forestgreen;
            border: 1px solid #999;
            cursor: default;
        }

        /* Number Colors (Classic Minesweeper) */
        .number-1 { color: white; }
        .number-2 { color: white; }
        .number-3 { color: white; }
        .number-4 { color: white; }
        .number-5 { color: white; }
        .number-6 { color: white; }
        .number-7 { color: white; }
        .number-8 { color: white; }

        .mine {
            background-color: #fff; /* Red on explosion */
            font-size: 18px;
        }

        .flag {
            color: red;
            font-size: 16px;
        }

        /* Message Box */
        #message-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Custom Message Box -->
    <div id="message-box" class="bg-white p-6 rounded-xl shadow-2xl border border-gray-200 w-80 fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
        <h3 id="message-title" class="text-xl font-bold mb-3 text-gray-800 text-center"></h3>
        <p id="message-body" class="text-base text-gray-600 mb-4 text-center"></p>
        <button id="message-close" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">OK</button>
    </div>

    <div class="p-6 bg-white rounded-xl shadow-2xl border border-gray-100 max-w-fit">
        <header class="mb-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-gray-800">Santa-Sweeper</h1>
            <button id="reset-button"
                    class="bg-green-500 text-white font-medium py-2 px-4 rounded-lg hover:bg-green-600 transition duration-300 shadow-md">
                Reset Game
            </button>
        </header>

        <div class="mb-4 flex justify-between text-lg font-medium text-gray-700">
            <span>Coal: <span id="mines-remaining">30</span></span>
            <span>Time: <span id="game-timer">0</span>s</span>
        </div>
       
        <!-- Game Board Container -->
        <div id="game-board">
            <!-- Cells generated by JavaScript -->
        </div>

        <div id="game-status" class="mt-4 text-center text-red-600 font-bold hidden"></div>

    </div>

    <script>
        // --- GAME CONSTANTS ---
        const BOARD_SIZE = 15; // Increased board size
        const MINE_COUNT = 30; // Increased mine count for difficulty
        const CELL_BLANK = 0;
        const CELL_MINE = 9;

        // --- GAME STATE ---
        let board = [];
        let isGameOver = false;
        let cellsRevealed = 0;
        let flagsUsed = 0;
        let startTime = null;
        let timerInterval = null;

        // --- DOM ELEMENTS ---
        const gameBoardElement = document.getElementById('game-board');
        const resetBtn = document.getElementById('reset-button');
        const minesRemainingElement = document.getElementById('mines-remaining');
        const gameTimerElement = document.getElementById('game-timer');
        const gameStatusElement = document.getElementById('game-status');

        // Message Box Elements
        const messageBox = document.getElementById('message-box');
        const messageTitle = document.getElementById('message-title');
        const messageBody = document.getElementById('message-body');
        const messageCloseBtn = document.getElementById('message-close');

        // --- UTILITY FUNCTIONS ---

        /** Shows a custom modal message box */
        function showMessage(title, body) {
            messageTitle.textContent = title;
            messageBody.textContent = body;
            messageBox.classList.remove('hidden');
            messageBox.style.display = 'block';
        }

        /** Closes the custom modal message box */
        messageCloseBtn.addEventListener('click', () => {
            messageBox.style.display = 'none';
        });
       
        /** Starts the game timer */
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                gameTimerElement.textContent = elapsed;
            }, 1000);
        }

        /** Stops the game timer */
        function stopTimer() {
            clearInterval(timerInterval);
        }

        /** Gets the neighbor coordinates for a given cell */
        function getNeighbors(r, c) {
            const neighbors = [];
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr;
                    const nc = c + dc;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                        neighbors.push({ r: nr, c: nc });
                    }
                }
            }
            return neighbors;
        }
       
        // --- GAME LOGIC ---

        /** Initializes the main game board array */
        function initializeBoard() {
            board = Array(BOARD_SIZE).fill(0).map(() =>
                Array(BOARD_SIZE).fill({
                    value: CELL_BLANK,
                    revealed: false,
                    flag: false,
                    element: null // DOM element reference
                })
            );
        }

        /** Randomly places mines on the board */
        function placeMines() {
            let minesPlaced = 0;
            while (minesPlaced < MINE_COUNT) {
                const r = Math.floor(Math.random() * BOARD_SIZE);
                const c = Math.floor(Math.random() * BOARD_SIZE);

                // Only place mine if cell is currently blank
                if (board[r][c].value !== CELL_MINE) {
                    board[r][c] = { ...board[r][c], value: CELL_MINE };
                    minesPlaced++;
                }
            }
        }
       
        /** Calculates and assigns the neighbor mine count for each non-mine cell */
        function calculateNeighborCounts() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c].value === CELL_MINE) continue;

                    let mineCount = 0;
                    const neighbors = getNeighbors(r, c);
                   
                    neighbors.forEach(n => {
                        if (board[n.r][n.c].value === CELL_MINE) {
                            mineCount++;
                        }
                    });

                    if (mineCount > 0) {
                        board[r][c] = { ...board[r][c], value: mineCount };
                    }
                }
            }
        }

        /** Creates the visual grid and attaches event listeners */
        function createGrid() {
            gameBoardElement.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 1fr)`;
            gameBoardElement.innerHTML = ''; // Clear previous board

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                   
                    cell.addEventListener('click', handleCellClick);
                    cell.addEventListener('contextmenu', handleRightClick);
                   
                    board[r][c] = { ...board[r][c], element: cell };
                    gameBoardElement.appendChild(cell);
                }
            }
        }

        /** Recursively reveals surrounding empty cells (flood fill) */
        function floodReveal(r, c) {
            // Base cases
            const cellState = board[r][c];
            if (cellState.revealed || cellState.flag || isGameOver) return;
           
            // Reveal this cell
            board[r][c] = { ...cellState, revealed: true, flag: false };
            cellState.element.classList.add('revealed');
            cellState.element.textContent = '';
            cellsRevealed++;
           
            if (cellState.value > CELL_BLANK) {
                // Stop recursion if it's a number cell
                cellState.element.textContent = cellState.value;
                cellState.element.classList.add(`number-${cellState.value}`);
                return;
            }
           
            // Continue recursion for neighbors if it's a blank cell (0)
            const neighbors = getNeighbors(r, c);
            neighbors.forEach(n => floodReveal(n.r, n.c));
        }

        /** Handles a left click on a cell */
        function handleCellClick(e) {
            e.preventDefault();
            if (isGameOver) return;
           
            const r = parseInt(this.dataset.r);
            const c = parseInt(this.dataset.c);
            const cellState = board[r][c];

            if (cellState.revealed || cellState.flag) return;
           
            if (startTime === null) startTimer();

            if (cellState.value === CELL_MINE) {
                // Game Over: Mine hit!
                cellState.element.textContent = '💣';
                cellState.element.classList.add('mine');
                gameOver(false);
            } else if (cellState.value === CELL_BLANK) {
                // Recursive reveal (flood fill)
                floodReveal(r, c);
            } else {
                // Reveal single number cell
                board[r][c] = { ...cellState, revealed: true };
                cellState.element.classList.add('revealed', `number-${cellState.value}`);
                cellState.element.textContent = cellState.value;
                cellsRevealed++;
            }
           
            checkWinCondition();
        }

        /** Handles a right click on a cell (flagging) */
        function handleRightClick(e) {
            e.preventDefault(); // Prevent context menu
            if (isGameOver) return;

            const r = parseInt(this.dataset.r);
            const c = parseInt(this.dataset.c);
            const cellState = board[r][c];

            if (cellState.revealed) return;

            if (cellState.flag) {
                // Unflag
                board[r][c] = { ...cellState, flag: false };
                cellState.element.classList.remove('flag');
                cellState.element.textContent = '';
                flagsUsed--;
            } else if (flagsUsed < MINE_COUNT) {
                // Flag
                board[r][c] = { ...cellState, flag: true };
                cellState.element.classList.add('fla');
                cellState.element.textContent = '💈';
                flagsUsed++;
            }
            minesRemainingElement.textContent = MINE_COUNT - flagsUsed;
        }

        /** Checks if the player has won the game */
        function checkWinCondition() {
            // Win condition: All non-mine cells are revealed
            const totalCells = BOARD_SIZE * BOARD_SIZE;
            const targetRevealed = totalCells - MINE_COUNT;
           
            if (cellsRevealed === targetRevealed) {
                gameOver(true);
            }
        }
       
        /** Ends the game */
        function gameOver(isWin) {
            isGameOver = true;
            postMessage(cellsRevealed, targetOrigin)
            stopTimer();

            if (isWin) {
                gameStatusElement.textContent = "🎁 MERRY CHRISTMAS 🎁";
                gameStatusElement.classList.remove('text-red-600', 'hidden');
                gameStatusElement.classList.add('text-green-600');
                showMessage("Congratulations!", `You saved christmas in ${gameTimerElement.textContent} seconds!`);
            } else {
                gameStatusElement.textContent = "💥 GAME OVER! 💥";
                gameStatusElement.classList.remove('text-green-600', 'hidden');
                gameStatusElement.classList.add('text-red-600');
                showMessage(" 🎅 Game Over 🎅 ", "You struck coal! Better luck next year.");

                // Reveal all mines on loss
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const state = board[r][c];
                        if (state.value === CELL_MINE && !state.revealed) {
                            state.element.classList.add('revealed', 'mine');
                            state.element.textContent = '☁';
                        } else if (state.flag && state.value !== CELL_MINE) {
                             // Indicate incorrectly placed flags
                            
                             state.element.style.backgroundColor = '#ffbbbb';
                        }
                    }
                }
            }
            resetBtn.textContent = 'Play Again';
        }

        /** Main function to start/reset the game */
        function startGame() {
            // Reset state
            isGameOver = false;
            cellsRevealed = 0;
            flagsUsed = 0;
            startTime = null;
            stopTimer();
            gameTimerElement.textContent = 0;
           
            // Reset UI
            minesRemainingElement.textContent = MINE_COUNT;
            gameStatusElement.classList.add('hidden');
            resetBtn.textContent = 'Reset Game';

            // Setup board logic and visualization
            initializeBoard();
            placeMines();
            calculateNeighborCounts();
            createGrid(); // Creates DOM elements and attaches event listeners
           
            console.log("Minesweeper board initialized.");
        }

        // --- EVENT LISTENERS & INIT ---
       
        resetBtn.addEventListener('click', startGame);

        // Start the game on load
        startGame();

    </script>
</body>
</html>
